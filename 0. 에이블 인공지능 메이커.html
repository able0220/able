<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>에이블 에듀테크 | 티처블 머신 시리얼 통신</title>

  <!-- p5.js 본체 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- ml5.js (Teachable Machine 이미지 분류) -->
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <!-- p5 시리얼 통신 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/p5.serialserver@0.0.29/lib/p5.serialport.js"></script>

  <style>
    :root {
      --able-dark: #1b3a8c;
      --able-mid: #2d6fd6;
      --able-light: #5bb8ef;
      --bg: #f4f8fd;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      margin: 0;
      background: linear-gradient(160deg, #eef4fc 0%, #e3eefb 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* 헤더 */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    header img {
      height: 64px;
      width: auto;
    }
    header .titles h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--able-dark);
    }
    header .titles p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* 설정 카드 */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 28px rgba(27, 58, 140, 0.10);
      margin-bottom: 20px;
    }
    .card h2 {
      margin: 0 0 18px;
      font-size: 16px;
      color: var(--able-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 18px;
      border-radius: 3px;
      background: linear-gradient(var(--able-light), var(--able-dark));
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1.5px solid #d6e2f2;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color .15s, box-shadow .15s;
      background: #fbfdff;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--able-mid);
      box-shadow: 0 0 0 3px rgba(45, 111, 214, 0.15);
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin: -12px 0 16px;
    }
    #start-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      border: none;
      border-radius: 10px;
      background: linear-gradient(120deg, var(--able-mid), var(--able-dark));
      transition: transform .08s, box-shadow .15s, opacity .15s;
      box-shadow: 0 6px 16px rgba(27, 58, 140, 0.28);
    }
    #start-btn:hover { box-shadow: 0 8px 22px rgba(27, 58, 140, 0.38); }
    #start-btn:active { transform: translateY(1px); }

    /* 보조 버튼 (정지/다시시작) */
    .btn-row { display: flex; gap: 10px; }
    .btn-secondary {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      border: 1.5px solid var(--able-mid);
      background: #fff;
      color: var(--able-mid);
      transition: background .15s, transform .08s;
    }
    .btn-secondary:hover { background: #eef4fc; }
    .btn-secondary:active { transform: translateY(1px); }
    .btn-secondary:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1.5px solid #d6e2f2;
      border-radius: 10px;
      font-size: 14px;
      background: #fbfdff;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: var(--able-mid);
      box-shadow: 0 0 0 3px rgba(45, 111, 214, 0.15);
    }

    /* 상태 표시 */
    #status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }
    #status.show { display: block; }
    #status.info    { background: #eaf2fe; color: var(--able-dark); }
    #status.success { background: #e6f7ec; color: #1b8a4b; }
    #status.error   { background: #fdeaea; color: #c0392b; }

    /* 캔버스 영역 */
    #canvas-card { text-align: center; }
    #canvas-card canvas {
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    }
    .label-badge {
      margin-top: 16px;
      display: inline-block;
      min-width: 120px;
      padding: 10px 24px;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      border-radius: 12px;
      background: linear-gradient(120deg, var(--able-light), var(--able-mid));
      letter-spacing: 1px;
    }
    .label-badge small {
      display: block;
      font-size: 11px;
      font-weight: 500;
      opacity: .85;
      letter-spacing: 0;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: var(--muted);
    }
    footer b { color: var(--able-dark); }
  </style>
</head>

        placeholder="https://teachablemachine.withgoogle.com/models/xxxxxx/"
        value="" />

      <input type="text" id="port-input" placeholder="COM3" value="COM3" />

  <script>
    let modelURL;
    let serialPort;
    let classifier;
    let serial;
    let video;
    let flippedVideo;
    let label = "";
    let started = false;     // 한 번이라도 시작했는지 (모델/시리얼 준비됨)
    let running = false;     // 현재 분류가 돌고 있는지
    let selectedDeviceId = ""; // 선택된 카메라

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'show ' + type;
    }

    // 페이지가 열리면 카메라 목록을 미리 채워둠
    async function loadCameraList() {
      const sel = document.getElementById('camera-select');
      try {
        // 라벨(카메라 이름)을 보려면 권한이 필요하므로 한 번 요청
        const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
        tmp.getTracks().forEach(t => t.stop()); // 바로 끔

        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');

        sel.innerHTML = '';
        if (cams.length === 0) {
          sel.innerHTML = '<option value="">카메라를 찾을 수 없습니다</option>';
          return;
        }
        cams.forEach((cam, i) => {
          const opt = document.createElement('option');
          opt.value = cam.deviceId;
          opt.textContent = cam.label || ('카메라 ' + (i + 1));
          sel.appendChild(opt);
        });
      } catch (e) {
        sel.innerHTML = '<option value="">카메라 권한을 허용해 주세요</option>';
      }
    }

    function startSketch() {
      if (started) {
        setStatus('이미 실행 중입니다. 카메라를 바꾸려면 정지 후 다시 시작하세요.', 'info');
        return;
      }

      modelURL = document.getElementById('model-input').value.trim();
      serialPort = document.getElementById('port-input').value.trim();
      selectedDeviceId = document.getElementById('camera-select').value;

      if (!modelURL || !serialPort) {
        setStatus('모델 주소와 COM 포트를 모두 입력하세요.', 'error');
        return;
      }
      if (!modelURL.endsWith('/')) modelURL += '/';

      started = true;
      running = true;
      setStatus('모델을 불러오는 중입니다...', 'info');

      classifier = ml5.imageClassifier(modelURL + 'model.json', modelLoaded);

      serial = new p5.SerialPort();
      serial.on('open', () => {
        setStatus('시리얼 포트(' + serialPort + ') 연결 성공! 카메라 앞에 물체를 비춰보세요.', 'success');
      });
      serial.on('error', (err) => {
        setStatus('시리얼 에러: ' + err + ' (아두이노 IDE 시리얼 모니터를 닫고 포트 번호를 확인하세요)', 'error');
      });
      serial.open(serialPort);
    }

    function modelLoaded() {
      const ph = document.getElementById('cam-placeholder');
      if (ph) ph.style.display = 'none';
      document.getElementById('label-badge').style.display = 'inline-block';
      const cnv = createCanvas(320, 240);
      cnv.parent('canvas-holder');

      startCamera();

      document.getElementById('start-btn').disabled = true;
      document.getElementById('stop-btn').disabled = false;
    }

    // 선택된 카메라로 비디오를 잡음
    function startCamera() {
      const constraints = selectedDeviceId
        ? { video: { deviceId: { exact: selectedDeviceId } } }
        : { video: true };

      video = createCapture(constraints);
      video.size(320, 240);
      video.hide();
      flippedVideo = ml5.flipImage(video);
      running = true;
      classifyVideo();
    }

    // 정지: 분류 멈추고 카메라 끔
    function stopSketch() {
      running = false;
      if (video) {
        video.remove();
        video = null;
      }
      setStatus('정지되었습니다. 카메라를 바꾼 뒤 "다시 시작"을 누르세요.', 'info');
      document.getElementById('stop-btn').disabled = true;
      document.getElementById('resume-btn').disabled = false;
    }

    // 다시 시작: 현재 선택된 카메라로 재가동
    function resumeSketch() {
      if (!started) return;
      selectedDeviceId = document.getElementById('camera-select').value;
      setStatus('다시 시작합니다...', 'success');
      startCamera();
      document.getElementById('stop-btn').disabled = false;
      document.getElementById('resume-btn').disabled = true;
    }

    function draw() {
      if (!running || !flippedVideo) {
        return;
      }
      background(0);
      image(flippedVideo, 0, 0);
    }

    function classifyVideo() {
      if (!running || !video) return;
      flippedVideo = ml5.flipImage(video);
      classifier.classify(flippedVideo, gotResult);
      flippedVideo.remove();
    }

    function gotResult(error, results) {
      if (error) {
        console.error(error);
        return;
      }
      if (!running) return;
      label = String(results[0].label);
      const badge = document.getElementById('label-badge');
      badge.innerHTML = label + '<small>현재 인식된 라벨</small>';
      if (serial) serial.write(label);
      classifyVideo();
    }

    // 페이지 로드시 카메라 목록 준비
    window.addEventListener('load', loadCameraList);
  </script>
</body>
</html>
